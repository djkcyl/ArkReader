[package]
name = "arkreader-desktop"
version = "1.2.0"
description = "ArkReader desktop and Android application"
edition = "2021"
publish = false

[workspace]
members = ["crates/resource-engine"]
resolver = "2"

[lib]
name = "arkreader_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arkreader-resource-engine = { path = "crates/resource-engine" }
axum = "0.8"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.web]
inherits = "release"
opt-level = 2
panic = "abort"
