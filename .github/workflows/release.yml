name: Release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Tag or commit to build (defaults to the triggering ref)
        type: string
        default: ''
      reuse_run:
        description: Reuse a verified run with matching source and package manifests
        type: string
        default: ''
      publish:
        description: Publish all verified platform packages
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: arkreader-release
  cancel-in-progress: false
jobs:
  source:
    name: Release source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Resolve immutable source and version
        id: identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const version = JSON.parse(fs.readFileSync('package.json')).version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error('Invalid release version');
          for (const file of ['src-tauri/Cargo.toml', 'src-tauri/crates/resource-engine/Cargo.toml']) {
            if (fs.readFileSync(file, 'utf8').match(/^version = "([^"]+)"/m)?.[1] !== version) throw Error('Package version mismatch: ' + file);
          }
          if (JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version !== version) throw Error('Tauri version mismatch');
          if (process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF !== 'refs/tags/v' + version) throw Error('Tag version mismatch');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'commit=' + execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() + '\n');
          NODE
      - name: Check reused run
        if: ${{ inputs.reuse_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.reuse_run }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '.path == ".github/workflows/release.yml" and .status == "completed"' | grep -qx true
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs?filter=latest&per_page=100" --jq '.jobs[]' |
            jq -s -e '[.[] | select(.name == "Desktop / Windows" or .name == "Desktop / macOS" or .name == "Desktop / Linux" or .name == "Mobile / Android" or .name == "Web / Static")] | length == 5 and all(.conclusion == "success")'
  desktop:
    name: Desktop
    needs: source
    if: ${{ !inputs.reuse_run }}
    uses: ./.github/workflows/desktop.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}
  mobile:
    name: Mobile
    needs: source
    if: ${{ !inputs.reuse_run }}
    uses: ./.github/workflows/mobile.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}
    secrets: inherit
  web:
    name: Web
    needs: source
    if: ${{ !inputs.reuse_run }}
    uses: ./.github/workflows/web.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}
  publish:
    name: Publish verified artifacts
    needs: [source, desktop, mobile, web]
    if: ${{ !cancelled() && needs.source.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.publish) && (inputs.reuse_run || (needs.desktop.result == 'success' && needs.mobile.result == 'success' && needs.web.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          merge-multiple: true
          path: release
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify provenance and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-release.mjs
