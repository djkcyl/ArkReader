name: Release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing tag or commit to build (defaults to the triggering ref)
        type: string
        default: ''
      publish:
        description: Create or update a draft release after all builds pass
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    name: Desktop
    uses: ./.github/workflows/desktop.yml
    with:
      source_ref: ${{ inputs.source_ref || github.ref }}
  mobile:
    name: Mobile
    uses: ./.github/workflows/mobile.yml
    with:
      source_ref: ${{ inputs.source_ref || github.ref }}
    secrets: inherit
  draft-release:
    name: Release draft
    needs: [desktop, mobile]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify and attach all platforms to a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          source_commit=$(git rev-parse HEAD)
          test "$(wc -l < release/SHA256SUMS.txt)" -eq 7
          test -f "release/ArkReader-$version-android-arm64.apk"
          if gh release view "$tag" --json isDraft >/tmp/arkreader-release.json 2>/dev/null; then
            if test "$(jq -r .isDraft /tmp/arkreader-release.json)" != true; then
              echo 'Release already published; verified packages remain available as build artifacts.'
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$source_commit" --title "ArkReader $version" --notes-file "docs/releases/$version.md"
          fi
          gh release edit "$tag" --target "$source_commit" --notes-file "docs/releases/$version.md"
          gh release upload "$tag" release/ArkReader-* release/SHA256SUMS.txt --clobber
