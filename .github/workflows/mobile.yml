name: Mobile
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
      - name: Reserve build space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          cache-read-only: false
      - run: rustup update stable --no-self-update && rustup target add aarch64-linux-android
      - run: npm ci
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
      - name: Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE LD LDFLAGS RUST NDK_HOME
      - name: Identify native media toolchain
        id: media_toolchain
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          const key = createHash('sha256').update(readFileSync(path.join(process.env.NDK_HOME, 'source.properties'))).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, 'key=' + key + '\n');
          NODE
      - name: Cache native media binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: media-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-media.sh') }}-${{ steps.media_toolchain.outputs.key }}
          path: |
            artifacts/media-build/android-*/libarkreader_ffmpeg.so
            artifacts/media-build/android-*/complete.sha256
            artifacts/media-build/android-*/FFmpeg-LICENSE.txt
            artifacts/media-build/android-*/FFmpeg-SOURCE.txt
      - name: Build native movie component
        run: bash tools/build-android-media.sh arm64-v8a
      - name: Android ARM64 package
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ARKREADER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          export ARKREADER_KEYSTORE="$RUNNER_TEMP/android-release.jks"
          node tools/android.mjs build --apk --target aarch64
      - name: Verify and stage signed Android release
        run: node tools/release-assets.mjs --android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-android-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 7
