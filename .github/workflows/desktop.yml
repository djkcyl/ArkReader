name: Desktop release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create or update a draft release after all builds pass
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  package:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-x64
          - os: macos-26
            id: macos-arm64
          - os: ubuntu-22.04
            id: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Linux WebView and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libasound2-dev xvfb gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - run: rustup update stable --no-self-update && rustup default stable
      - run: npm ci
      - run: npm run format:check
      - name: Build installers and no-install packages
        run: npm run desktop:build
      - name: Native routing tests
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then export MACOSX_DEPLOYMENT_TARGET=12.0; fi
          cargo test --release --locked --workspace --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Native resource initialization and startup
        if: runner.os != 'Linux'
        run: node tools/verify-release.mjs
      - name: AppImage resource initialization and startup
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a node tools/verify-release.mjs src-tauri/target/release/bundle/appimage/*.AppImage
      - run: node tools/release-assets.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.id }}
          path: release/*
          if-no-files-found: error
          retention-days: 7
  draft-release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify and attach all platforms to a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --json isDraft >/tmp/arkreader-release.json 2>/dev/null; then
            if test "$(jq -r .isDraft /tmp/arkreader-release.json)" != true; then
              echo 'Release already published; verified packages remain available as build artifacts.'
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "ArkReader $version" --notes-file docs/releases/1.0.0.md
          fi
          gh release upload "$tag" release/ArkReader-* release/SHA256SUMS.txt --clobber
