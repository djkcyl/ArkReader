name: Desktop
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
jobs:
  package:
    name: ${{ matrix.label }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-x64
            label: Windows
          - os: macos-26
            id: macos-arm64
            label: macOS
          - os: ubuntu-22.04
            id: linux-x64
            label: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Windows media build tools
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        with:
          msystem: UCRT64
          install: make diffutils mingw-w64-ucrt-x86_64-gcc
      - name: Linux WebView and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libasound2-dev xvfb pulseaudio gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - name: Identify native media toolchain
        id: media_toolchain
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          const compiler = process.platform === 'win32' ? path.join(process.env.MSYS2_ROOT, 'ucrt64/bin/gcc.exe') : 'cc';
          const key = createHash('sha256').update(execFileSync(compiler, ['--version'], { windowsHide: true })).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, 'key=' + key + '\n');
          NODE
      - name: Cache native media binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: media-${{ matrix.id }}-${{ env.ImageVersion }}-${{ hashFiles('tools/build-media.sh') }}-${{ steps.media_toolchain.outputs.key }}
          path: |
            artifacts/media-build/${{ matrix.id }}-*/ffmpeg
            artifacts/media-build/${{ matrix.id }}-*/ffmpeg.exe
            artifacts/media-build/${{ matrix.id }}-*/complete.sha256
            artifacts/media-build/${{ matrix.id }}-*/FFmpeg-LICENSE.txt
            artifacts/media-build/${{ matrix.id }}-*/FFmpeg-SOURCE.txt
      - name: Build installers and no-install packages
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: npm run desktop:build
      - name: Native resource initialization and startup
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: AppImage resource initialization and startup
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          GST_DEBUG: '2'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=arkreader_verify
          export PULSE_SINK=arkreader_verify
          xvfb-run -a npm run test:desktop -- src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Native verification log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ matrix.id }}
          path: artifacts/native-startup.log
          retention-days: 7
      - run: node tools/release-assets.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.id }}
          path: release/*
          if-no-files-found: error
          retention-days: 7
