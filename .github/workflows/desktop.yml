name: Desktop
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
jobs:
  package:
    name: ${{ matrix.label }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-x64
            label: Windows
          - os: macos-26
            id: macos-arm64
            label: macOS
          - os: ubuntu-22.04
            id: linux-x64
            label: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Windows media build tools
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        with:
          msystem: UCRT64
          install: make diffutils mingw-w64-ucrt-x86_64-gcc
      - name: Linux WebView and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libasound2-dev xvfb pulseaudio gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - run: rustup update stable --no-self-update && rustup default stable
      - run: npm ci
      - run: npm run format:check
      - name: Build installers and no-install packages
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: npm run desktop:build
      - name: Native routing tests
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then export MACOSX_DEPLOYMENT_TARGET=12.0; fi
          cargo test --release --locked --workspace --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Native resource initialization and startup
        if: runner.os != 'Linux'
        run: node tools/verify-release.mjs
      - name: AppImage resource initialization and startup
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          GST_DEBUG: '2'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=arkreader_verify
          export PULSE_SINK=arkreader_verify
          xvfb-run -a node tools/verify-release.mjs src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Native verification log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ matrix.id }}
          path: artifacts/native-startup.log
          retention-days: 7
      - run: node tools/release-assets.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.id }}
          path: release/*
          if-no-files-found: error
          retention-days: 7
