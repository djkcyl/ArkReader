<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <title>ArkReader · 剧情播放器</title>
  </head>
  <body>
    <div id="app">
      <section
        id="ui-bootstrap"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #131b21;
          color: #dbe8ec;
          font:
            14px/1.8 'Segoe UI',
            'Microsoft YaHei',
            sans-serif;
          padding: 32px;
          box-sizing: border-box;
          z-index: 9999;
        "
      >
        <div style="max-width: 620px">
          <p style="letter-spacing: 3px; color: #93c6c5">ARKREADER</p>
          <h1 style="font-size: 26px; font-weight: 500">正在打开界面</h1>
          <p data-ui-detail style="white-space: pre-wrap; overflow-wrap: anywhere">
            正在打开剧情库…
          </p>
          <div data-ui-actions hidden>
            <button data-ui-retry type="button" style="padding: 10px 20px; margin-right: 12px">
              重新尝试</button
            ><button data-ui-close type="button" style="padding: 10px 20px">关闭程序</button>
          </div>
        </div>
      </section>
    </div>
    <script src="./ui-watchdog.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
